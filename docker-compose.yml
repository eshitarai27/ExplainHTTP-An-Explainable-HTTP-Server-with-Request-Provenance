services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8080:8080"
    environment:
      EXPLAINHTTP_HOST: 0.0.0.0
      EXPLAINHTTP_PORT: 8080
      EXPLAINHTTP_CORS_ORIGIN: "*"
      EXPLAINHTTP_MAX_TRACES: 500
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
